<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Lilo 🎈</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="floaty-hearts" aria-hidden="true">
  <span>💛</span><span>✨</span><span>🎈</span><span>💛</span><span>✨</span><span>🎈</span><span>💛</span>
</div>

<header class="hero">
  <p class="eyebrow">something special is coming for</p>
  <h1 class="name">Lilo</h1>
  <p class="date-sub">August 11, 2026</p>

  <div id="hero-countdown" class="countdown-grid">
    <div class="time-block"><span id="cd-days">00</span><label>days</label></div>
    <div class="time-block"><span id="cd-hours">00</span><label>hours</label></div>
    <div class="time-block"><span id="cd-mins">00</span><label>mins</label></div>
    <div class="time-block"><span id="cd-secs">00</span><label>secs</label></div>
  </div>

  <p id="hero-message" class="hero-message"></p>
</header>

<section class="gallery" aria-label="Us">
  <h2 class="gallery-title">us, lately <span class="wiggle">💛</span></h2>
  <p class="gallery-sub">tap a photo</p>
  <div class="polaroid-grid" id="polaroid-grid">
    <figure class="polaroid" data-caption="[add a memory about this one]"><img src="images/photo-01.jpg" alt="A photo of us" loading="lazy"></figure>
    <figure class="polaroid" data-caption="[add a memory about this one]"><img src="images/photo-02.jpg" alt="A photo of us" loading="lazy"></figure>
    <figure class="polaroid" data-caption="[add a memory about this one]"><img src="images/photo-03.jpg" alt="A photo of us" loading="lazy"></figure>
    <figure class="polaroid" data-caption="[add a memory about this one]"><img src="images/photo-04.jpg" alt="A photo of us" loading="lazy"></figure>
    <figure class="polaroid" data-caption="[add a memory about this one]"><img src="images/photo-05.jpg" alt="A photo of us" loading="lazy"></figure>
    <figure class="polaroid" data-caption="[add a memory about this one]"><img src="images/photo-06.jpg" alt="A photo of us" loading="lazy"></figure>
    <figure class="polaroid" data-caption="[add a memory about this one]"><img src="images/photo-07.jpg" alt="A photo of us" loading="lazy"></figure>
    <figure class="polaroid" data-caption="[add a memory about this one]"><img src="images/photo-08.jpg" alt="A photo of us" loading="lazy"></figure>
    <figure class="polaroid" data-caption="[add a memory about this one]"><img src="images/photo-09.jpg" alt="A photo of us" loading="lazy"></figure>
    <figure class="polaroid" data-caption="[add a memory about this one]"><img src="images/photo-10.jpg" alt="A photo of us" loading="lazy"></figure>
  </div>
</section>

<main class="timeline">
  <h2 class="timeline-title">Today's Plan <span class="wiggle">✨</span></h2>
  <p class="timeline-sub">three stations. all secret. all yours, one at a time.</p>
  <div class="stations" id="stations"></div>
</main>

<footer>
  <p>made with love (and way too much css), just for you 💛</p>
</footer>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close">✕</button>
  <figure class="lightbox-figure">
    <img id="lightbox-img" src="" alt="">
    <figcaption id="lightbox-caption"></figcaption>
  </figure>
</div>

<script src="script.js"></script>
</body>
</html>
